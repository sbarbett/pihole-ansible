- name: Manage Pi-hole domains
  hosts: localhost
  gather_facts: false
  roles:
    - role: sbarbett.pihole.domain_management
      vars:
        pihole_hosts:
          - name: "https://your-pihole-1.example.com"
            password: "{{ pihole_password }}"
          - name: "https://your-pihole-2.example.com"
            password: "{{ pihole_password }}"
        
        pihole_domains:
          - domain: example.com
            domain_type: deny
            kind: exact
            comment: Block example.com
            groups:
              - Default
            enabled: true
            state: present
          - domain: "(\\.|^)googlevideo\\.com$"
            domain_type: deny
            kind: regex
            comment: Google Video
            groups: 
              - Echos
            enabled: false
            state: present
          - domain: 
              - msh.amazon.com
              - msh.amazon.co.uk
              - arcus-uswest.amazon.com
            domain_type: deny
            kind: exact
            groups: 
              - Echos
            enabled: True
            state: present
          - domain: old.example.com
            domain_type: allow
            kind: exact
            state: absent